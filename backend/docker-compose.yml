version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: it_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: crm_admin
      POSTGRES_PASSWORD: crm_secret_password
      POSTGRES_DB: it_crm_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: it_crm_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: it_crm_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://crm_admin:crm_secret_password@postgres:5432/it_crm_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secure_jwt_secret_key_omnitech_2026
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
